<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Anime Pet</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 height:100vh;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#dceaff,#f7e9ff,#e8f5ff);
}
.header{
 text-align:center;
 padding:25px;
 color:#52658c;
}
.header h2{margin:0}
.pet{
 position:absolute;
 left:50%;
 top:45%;
 transform:translate(-50%,-50%);
 width:210px;
 text-align:center;
 cursor:grab;
 user-select:none;
 touch-action:none;
 animation:float 3s infinite ease-in-out;
}
.character{
 font-size:145px;
 filter:drop-shadow(0 12px 12px #8294bd66);
}
.face{
 position:relative;
 width:150px;
 height:175px;
 margin:auto;
 background:linear-gradient(135deg,#fff,#dce5ff);
 border-radius:48% 48% 45% 45%;
 box-shadow:inset -10px -8px 15px #b9c9ed;
}
.hair{
 position:absolute;
 top:-22px;
 left:-8px;
 width:166px;
 height:85px;
 background:linear-gradient(135deg,#fff,#c9d5ed);
 border-radius:55% 55% 30% 30%;
}
.eye{
 position:absolute;
 top:91px;
 width:17px;
 height:23px;
 background:#526aab;
 border-radius:50%;
}
.eye.left{left:35px}
.eye.right{right:35px}
.blush{
 position:absolute;
 top:123px;
 width:23px;
 height:10px;
 background:#ffb9ce;
 border-radius:50%;
 opacity:.65;
}
.blush.left{left:17px}
.blush.right{right:17px}
.mouth{
 position:absolute;
 top:125px;
 left:69px;
 font-size:18px;
 color:#a36d87;
}
.info{
 position:absolute;
 bottom:95px;
 left:50%;
 transform:translateX(-50%);
 width:85%;
 max-width:350px;
 padding:20px;
 background:#ffffffaa;
 backdrop-filter:blur(15px);
 border-radius:20px;
 text-align:center;
 color:#59698d;
}
button{
 border:0;
 padding:12px 18px;
 margin:5px;
 border-radius:15px;
 background:#dce6ff;
 color:#52658c;
 font-size:15px;
}
@keyframes float{
 0%,100%{margin-top:0}
 50%{margin-top:-15px}
}
</style>
</head>

<body>

<div class="header">
<h2>♡ My Anime Pet ♡</h2>
<p>我的专属二次元桌宠</p>
</div>

<div class="pet" id="pet">
 <div class="face">
  <div class="hair"></div>
  <div class="eye left"></div>
  <div class="eye right"></div>
  <div class="blush left"></div>
  <div class="blush right"></div>
  <div class="mouth">ω</div>
 </div>
</div>

<div class="info">
 <div id="message">你好呀！我是你的白发桌宠～</div>
 <br>
 <button onclick="talk()">互动</button>
 <button onclick="sleep()">睡觉</button>
 <button onclick="wake()">起床</button>
</div>

<script>
const pet=document.getElementById("pet");
const message=document.getElementById("message");

function talk(){
 message.innerText="主人，今天也要开心哦！♡";
}
function sleep(){
 message.innerText="Zzz... 我先睡一会儿～";
 pet.style.animation="none";
}
function wake(){
 message.innerText="早上好！我醒啦！";
 pet.style.animation="float 3s infinite ease-in-out";
}

let dragging=false,dx=0,dy=0;

pet.addEventListener("pointerdown",e=>{
 dragging=true;
 const r=pet.getBoundingClientRect();
 dx=e.clientX-r.left;
 dy=e.clientY-r.top;
 pet.setPointerCapture(e.pointerId);
 pet.style.animation="none";
});

pet.addEventListener("pointermove",e=>{
 if(!dragging)return;
 pet.style.left=(e.clientX-dx)+"px";
 pet.style.top=(e.clientY-dy)+"px";
 pet.style.transform="none";
});

pet.addEventListener("pointerup",()=>{
 dragging=false;
});
</script>

</body>
</html>
